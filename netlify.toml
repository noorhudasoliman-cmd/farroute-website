# Farroute site.
#
# index.html is currently the design reference from the October handoff, not a
# production build. The handoff README calls for recreating these screens in a
# real codebase. One thing must still change before launch on December 15,
# 2026: the map tiles have to be pre-rendered and self-hosted rather than
# fetched from Wikimedia and NASA at runtime.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
